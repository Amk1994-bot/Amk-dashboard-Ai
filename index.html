:root{--navy:#0b2447;--navy2:#19376d;--teal:#0fb5ae;--teal2:#0a8f8a;--bg:#eef3f8;--red:#d64550;--amber:#e8a317;--green:#1f9d6b;--ink:#14213d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:AmkF,IRANSansX,IRANSans,Tahoma,sans-serif;font-weight:500;line-height:1.8}
h1,h2,h3,.titr{font-family:AmkF,"B Titr",IRANSans,Tahoma,sans-serif;font-weight:900}
header{background:linear-gradient(120deg,var(--navy),var(--navy2) 60%,var(--teal2));color:#fff;padding:26px 5vw;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header svg{width:84px;height:84px;flex:none}
header h1{margin:0;font-size:clamp(24px,3.4vw,38px)}header p{margin:4px 0 0;font-weight:700;font-size:16px;opacity:.95}
main{padding:22px 5vw 40px;max-width:1500px;margin:auto}
section{margin-top:28px}
.sh{border-right:8px solid var(--teal);padding-right:14px;margin-bottom:14px}
.sh h2{margin:0;font-size:clamp(22px,2.6vw,30px);color:var(--navy)}.sh p{margin:2px 0 0;font-weight:700;color:#41536f;font-size:15px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(11,36,71,.09);padding:18px;border-top:4px solid var(--teal)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}.card{overflow-x:auto}img,svg{max-width:100%}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.kpi .l{font-weight:800;color:#41536f;font-size:15px}.kpi .v{font-family:AmkF,"B Titr",IRANSans,Tahoma;font-weight:900;font-size:clamp(19px,2vw,26px);color:var(--navy);margin:4px 0;word-break:break-all}.kpi .s{font-size:13.5px;font-weight:700;color:#5b6b85}
.kpi.bad{border-top-color:var(--red)}.kpi.bad .v{color:var(--red)}
.summary{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-top-color:var(--teal)}
.summary ol{margin:0;padding:0;list-style:none;counter-reset:c;display:grid;gap:10px}.summary li{counter-increment:c;font-size:16.5px;font-weight:500;padding:12px 56px 12px 14px;border-radius:12px;position:relative;border-right:5px solid var(--teal)}.summary li::before{content:counter(c);position:absolute;right:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;text-align:center;line-height:30px;font-weight:900}.summary li:nth-child(odd){background:rgba(255,255,255,.08)}.summary li:nth-child(even){background:rgba(15,181,174,.22)}
table{width:100%;border-collapse:collapse;font-size:15px}th{background:var(--navy);color:#fff;padding:9px;font-weight:800}td{padding:8px 9px;border-bottom:1px solid #e1e8f0;font-weight:700;text-align:center}
tr.tophd td{background:#d6f3e4!important;color:#13734d!important}tr.lowh td{background:#fbdadd!important;color:#b3303b!important}tr.sep td{font-weight:900!important;font-size:15px!important;background:#f3f7fb;color:#41536f;font-size:13px}.up{color:var(--green)}.dn{color:var(--red)}
